<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Pawprint Tagger</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>Pawprint Tagger</h1>
  <button id="add" type="button">Add current booru post</button>
  <p id="status" role="status" aria-live="polite">Original images and their tags go straight to your library.</p>
  <button id="check" type="button">Check desktop connection</button>
  <h2>Recent imports</h2>
  <ul id="transfers"></ul>
  <p class="note">Downloaded originals stay in your Downloads/PawprintTagger folder. The library stores its own copy.</p>
  <a href="help.html" target="_blank" rel="noopener">Setup &amp; help</a>
  <script src="popup.js"></script>
</body>
</html>
